<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Перелёт Земля — Каллисто</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <h1>Перелёт Земля — Каллисто</h1>
    </header>

    <div id="gameWrap">
      <canvas id="gameCanvas"></canvas>
      <div id="hud">
        <div class="hud-row"><span>Время:</span><span id="hudTime">0 ч</span></div>
        <div class="hud-row"><span>Скорость:</span><span id="hudSpeed">0 км/с</span></div>
        <div class="hud-row"><span>ΔV:</span><span id="hudDv">0 / 8 км/с</span></div>
      </div>
    </div>

    <div id="controls">
      <div class="control-block">
        <label for="powerSlider">Сила импульса: <span id="powerValue">50</span>%</label>
        <input type="range" id="powerSlider" min="0" max="100" value="50" step="1">
      </div>
      <div class="control-block">
        <label for="angleSlider">Направление: <span id="angleValue">20</span>°</label>
        <input type="range" id="angleSlider" min="0" max="359" value="20" step="1">
      </div>
      <div class="buttons">
        <button id="launchBtn" type="button">Запуск</button>
        <button id="resetBtn" type="button" disabled>Заново</button>
      </div>
      <p id="statusMsg" class="status">Попробуйте силу 50% и угол 20°.</p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
